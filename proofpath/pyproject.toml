[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["services"]
exclude = ["tests/e2e", "tests/live"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contracts", "services"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
