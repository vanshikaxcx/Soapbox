[project]
name = "proofpath"
version = "0.0.0"
description = "ProofPath baseline Python toolchain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.13.5,<3",
  # services/agent: FastAPI transport and its ASGI server.
  "fastapi>=0.115.6,<0.116",
  "uvicorn[standard]>=0.32.1,<0.33",
  # services/merchants: live-connector browser automation (Blinkit/Zepto).
  "playwright>=1.49.1,<1.50",
]

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
namespaces = true

[dependency-groups]
dev = [
  # WP-02's invariants are stated as properties, not examples: unit conversion,
  # comparison antisymmetry and the money bounds are checked over generated
  # inputs rather than a handful of chosen ones.
  "hypothesis>=6.140,<7",
  "mypy>=2.3.1,<2.4",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.7,<0.17",
]

[tool.ruff]
target-version = "py312"
line-length = 100
preview = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# Tests sit beside the behaviour they describe (services/**/*_test.py) as well as
# in tests/. pythonpath keeps `services` importable without an editable install.
testpaths = ["tests", "services"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["services", "tests"]

# services.application.ports.MerchantPort is WP-08's, not yet built (see
# services/merchants/p3_merchant_port_adapter.py's module docstring). The
# import is deliberate and only unused (noqa: F401) today as a structural
# type-check target for when WP-08 lands; remove this override then.
[[tool.mypy.overrides]]
module = ["services.merchants.p3_merchant_port_adapter"]
disable_error_code = ["attr-defined"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
