[project]
name = "proofpath"
version = "0.0.0"
description = "ProofPath baseline Python toolchain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.13.5,<3",
  # services/agent: FastAPI transport and its ASGI server.
  "fastapi>=0.128,<0.142",
  "uvicorn[standard]>=0.32.1,<0.33",
  # Pinned directly, not left to fastapi's own loose ">=0.46.0": that floor
  # resolves to 0.46.2, which has multiple published CVEs (PYSEC-2026-1941/
  # 1942/161/2280/2281/248/249) fixed starting 1.3.1.
  "starlette>=1.3.1,<2",
  # services/merchants: live-connector browser automation (Blinkit/Zepto).
  "playwright>=1.49.1,<1.50",
  # Two users: services/merchants/evidence.py's S3EvidenceSink (WP-01
  # AC-01-04, deployed Fargate task only) and WP-07's DynamoDB StateStore
  # adapter, which the composition root selects by environment and so must
  # be installed wherever the application runs. Floor is WP-07's, the
  # higher of the two. Only services/adapters/** and services/merchants/**
  # may import it -- the boundary tests fail the build otherwise.
  "boto3>=1.42.0,<2",
]

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
namespaces = true

[dependency-groups]
dev = [
  # WP-02's invariants are stated as properties, not examples: unit conversion,
  # comparison antisymmetry and the money bounds are checked over generated
  # inputs rather than a handful of chosen ones.
  "hypothesis>=6.140,<7",
  # starlette>=1.0's TestClient requires this (see main_test.py's use of
  # fastapi.testclient.TestClient); test-only, never needed at runtime.
  "httpx2>=2.13,<3",
  # Type information for boto3. Dev-only because it ships no runtime code; mypy
  # runs strict over services/**, and an untyped client would make the adapter's
  # calls Any and quietly stop checking them.
  "boto3-stubs[dynamodb,events,stepfunctions]>=1.42.0,<2",
  # An in-process DynamoDB, so the conformance suite proves the adapter against
  # real conditional-write and transaction semantics with no AWS account, no
  # network and no shared fixture to leak between tests.
  "moto[dynamodb,events,stepfunctions]>=5.1.0,<6",
  "mypy>=2.3.1,<2.4",
  # The infra wiring contract test reads infra/template.yaml. PyYAML arrives
  # transitively with moto anyway; declared here because a test that depends on
  # a transitive dependency breaks the day the intermediate one drops it.
  "pyyaml>=6.0,<7",
  # Stubs for the above. Without them mypy reads yaml as Any, and a test that
  # subclasses SafeLoader becomes an error rather than a checked class.
  "types-pyyaml>=6.0,<7",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.7,<0.17",
]

[tool.ruff]
target-version = "py312"
line-length = 100
preview = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# Tests sit beside the behaviour they describe (services/**/*_test.py) as well as
# in tests/. pythonpath keeps `services` importable without an editable install.
testpaths = ["tests", "services"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["services", "tests"]

# services.application.ports.MerchantPort is WP-08's, not yet built (see
# services/merchants/p3_merchant_port_adapter.py's module docstring). The
# import is deliberate and only unused (noqa: F401) today as a structural
# type-check target for when WP-08 lands; remove this override then.
[[tool.mypy.overrides]]
module = ["services.merchants.p3_merchant_port_adapter"]
disable_error_code = ["attr-defined"]

# boto3-stubs[dynamodb] covers WP-07's DynamoDB adapter, but nothing else here:
# boto3/botocore ship no py.typed marker, and stubbing the rest would need a
# pin per service used, which is premature before WP-01 fixes which Bedrock/AWS
# calls this project actually makes. This override covers the bare `import
# boto3` construction call in S3EvidenceSink (services/merchants/evidence.py)
# and bedrock.py's `from botocore.exceptions import ...` -- every typed call
# site stays off boto3/botocore's untyped surface via S3ClientProtocol, not a
# repo-wide untyped-imports allowance.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
