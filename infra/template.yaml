AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  ProofPath WP-00 public health baseline, extended by WP-01 with the AC-01-04
  Fargate/Playwright agent infrastructure, the real Cognito user pool/Amplify
  hosting, and the canonical AppTable. WP-01's disposable checkpoint API and
  durable-job-chain proof-of-concept (AC-01-01/03/05) have been removed once
  their evidence was captured (docs/evidence/checkpoint.md) and WP-07 began
  building the real job chain against this same AppTable -- see WP-01's own
  spec: "This checkpoint can use thin vertical code that later packages
  replace behind the same contracts. It must not become an alternate
  architecture." Per docs/specs/WP-01-cloud-viability-checkpoint.md's
  "minimal stack boundaries" decision, WP-01's remaining resources stay in
  this one template rather than a separate stack file.

Parameters:
  # AC-01-04: the Fargate Playwright task needs outbound internet access to
  # reach real merchant domains. Using this account's existing default VPC's
  # public subnets (AWS-managed, already present, already routed to an
  # Internet Gateway) with `AssignPublicIp: ENABLED` avoids provisioning a
  # NAT Gateway entirely -- a NAT Gateway bills hourly (~$32/month)
  # regardless of task activity and this spec explicitly flags it as the
  # single largest standing-cost risk this package could create if
  # forgotten (see this file's header and docs/specs/WP-01's Observability
  # section). No new VPC/subnet is created here; a default VPC not existing
  # on this account is a real deploy-time blocker, not silently worked
  # around.
  CheckpointVpcId:
    Type: AWS::EC2::VPC::Id
    Description: >-
      The account's default VPC (verify with `aws ec2 describe-vpcs
      --filters Name=is-default,Values=true` before deploying).
  CheckpointPublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      One or more public subnets of CheckpointVpcId, each with
      `MapPublicIpOnLaunch: true` (verify with `aws ec2 describe-subnets
      --filters Name=default-for-az,Values=true`).

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10

Resources:
  ProofPathApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      # DefinitionBody below is generated FROM contracts/openapi.yaml (the
      # one authored, hand-edited API contract) by
      # scripts/generate-checkpoint-api-definition.mjs -- do not hand-edit
      # the content between the BEGIN/END markers; edit
      # contracts/openapi.yaml and re-run that script instead (it also runs
      # automatically as part of `pwsh ./scripts/proofpath.ps1 build`).
      #
      # Why a generated inline DefinitionBody instead of `DefinitionUri:
      # ../contracts/openapi.yaml`: two real, verified problems come from
      # DefinitionUri here. (1) SAM's implicit-API merge, which injects
      # `x-amazon-apigateway-integration` for each Lambda's `Events: Api:`
      # config, reliably works only against Swagger 2.0 content -- against
      # contracts/openapi.yaml's OpenAPI 3.0.3 (required by
      # scripts/check-openapi-aws-subset.mjs and the web codegen step), no
      # integration is injected and the deployed API fails with "No
      # integration defined for method". (2) SAM's `Auth` property on
      # AWS::Serverless::Api only works with an inline `DefinitionBody`, and
      # CloudFormation does not evaluate intrinsics (e.g. the Cognito User
      # Pool's ARN) inside a DefinitionUri-referenced file's content at all.
      # `DefinitionBody: Fn::Transform: AWS::Include` was tried to bridge
      # this and rejected by `sam validate` ("Unable to add Auth
      # configuration because 'DefinitionBody' does not contain a valid
      # Swagger definition" -- SAM's local Auth-merging step does not
      # resolve CloudFormation transforms before looking for route content).
      # The generator produces a Swagger 2.0 equivalent with a raw
      # `x-amazon-apigateway-authorizer` Cognito extension and explicit
      # `x-amazon-apigateway-integration` blocks (using literal `Fn::Sub`/
      # `Fn::GetAtt`, resolved because this is now literal template content,
      # not an external reference), so contracts/openapi.yaml stays the one
      # authored contract with no manual duplication of its routes.
      # _resolve_owner_from_cognito_claims in services/api/checkpoint.py
      # already assumes the target end state (API Gateway populates
      # requestContext.authorizer.claims before the Lambda runs); this
      # wiring is what actually populates that claim.
      # GENERATED-DEFINITION-BODY-BEGIN
      DefinitionBody:
        swagger: '2.0'
        info:
          title: ProofPath API
          version: 0.0.0
        schemes:
          - https
        securityDefinitions:
          CheckpointCognitoAuthorizer:
            type: apiKey
            name: Authorization
            in: header
            x-amazon-apigateway-authtype: cognito_user_pools
            x-amazon-apigateway-authorizer:
              type: cognito_user_pools
              providerARNs:
                - Fn::GetAtt:
                    - CheckpointUserPool
                    - Arn
        paths:
          /health:
            get:
              operationId: getHealth
              summary: Return the public liveness result.
              parameters: []
              responses:
                '200':
                  description: The service is live.
                  headers:
                    X-Request-ID:
                      description: Opaque server-generated request identifier.
                      type: string
                      minLength: 1
                  schema:
                    $ref: '#/definitions/HealthSuccessResponse'
                '500':
                  description: An unexpected error was safely mapped by the application.
                  headers:
                    X-Request-ID:
                      description: Opaque server-generated request identifier.
                      type: string
                      minLength: 1
                  schema:
                    $ref: '#/definitions/ErrorResponse'
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HealthFunction.Arn}/invocations
            options:
              summary: CORS preflight (no application logic; handled entirely by API Gateway).
              responses:
                '200':
                  description: CORS preflight response.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                    Access-Control-Allow-Methods:
                      type: string
                    Access-Control-Allow-Headers:
                      type: string
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: '''*'''
                      method.response.header.Access-Control-Allow-Methods: '''GET,OPTIONS'''
                      method.response.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,Idempotency-Key'''
        definitions:
          OpaqueId:
            type: string
            minLength: 1
            description: Opaque identifier. Clients must not parse it or infer its meaning.
          UtcTimestamp:
            type: string
            format: date-time
            description: RFC 3339 timestamp normalized to UTC by servers.
          CurrencyCode:
            type: string
            enum:
              - INR
          MoneyINR:
            type: object
            additionalProperties: false
            required:
              - amount_paise
              - currency
            properties:
              amount_paise:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              currency:
                $ref: '#/definitions/CurrencyCode'
          Version:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          Revision:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          JobStatus:
            type: string
            enum:
              - queued
              - running
              - succeeded
              - failed
          AsyncAccepted:
            type: object
            additionalProperties: false
            required:
              - job_id
              - resource_id
              - status_url
            properties:
              job_id:
                $ref: '#/definitions/OpaqueId'
              resource_id:
                $ref: '#/definitions/OpaqueId'
              status_url:
                type: string
                format: uri
          HealthData:
            type: object
            additionalProperties: false
            required:
              - status
            properties:
              status:
                type: string
                enum:
                  - ok
          HealthSuccessResponse:
            type: object
            additionalProperties: false
            required:
              - data
              - request_id
            properties:
              data:
                $ref: '#/definitions/HealthData'
              request_id:
                $ref: '#/definitions/OpaqueId'
          ErrorBody:
            type: object
            additionalProperties: false
            required:
              - code
              - message
              - details
            properties:
              code:
                type: string
                pattern: ^[a-z][a-z0-9_]*$
              message:
                type: string
              details:
                type: object
                additionalProperties: true
          ErrorResponse:
            type: object
            additionalProperties: false
            required:
              - error
              - request_id
            properties:
              error:
                $ref: '#/definitions/ErrorBody'
              request_id:
                $ref: '#/definitions/OpaqueId'
      # GENERATED-DEFINITION-BODY-END

  # RESOLVED (code-review finding 2, 2026-09-19): API Gateway's Cognito
  # authorizer rejects an unauthenticated/invalid-token request *before* the
  # Lambda (and this API's mock CORS integration response) ever runs, so a
  # browser calling this API from the deployed web origin with a missing/bad
  # token would see an opaque CORS failure instead of the real 401/403.
  # API Gateway's "gateway response" mechanism runs independently of any
  # backend integration specifically to cover this. SAM's `GatewayResponses`
  # shorthand property was tried first and reproduces the same
  # DefinitionBody/Fn::Transform merge bug this template's ProofPathApi
  # comment already documents for SAM's `Auth` property (`sam validate`
  # fails with "Unable to add Auth configuration because 'DefinitionBody'
  # does not contain a valid Swagger definition"). The working fix instead
  # uses the raw AWS::ApiGateway::GatewayResponse resource type below: it
  # attaches to ProofPathApi by RestApiId as an ordinary sibling
  # CloudFormation resource, entirely outside SAM's DefinitionBody-merging
  # step. UNAUTHORIZED covers the missing/invalid bearer token case the
  # Cognito authorizer actually returns; DEFAULT_4XX is a catch-all.
  # `sam validate --lint` reports cfn-lint rule W3660 ("multiple resources
  # modifying a Rest API definition") against both -- a known false positive
  # for this legitimate pattern, not a structural error.
  #
  # KNOWN GAP, not fixed here: the generated DefinitionBody's own CORS mock
  # OPTIONS integrations above still return a wildcard
  # Access-Control-Allow-Origin: '*' (see scripts/generate-checkpoint-api-
  # definition.mjs), which is a real deviation from CLAUDE.md's "use strict
  # CORS with an explicit origin allowlist" rule. That wildcard is generated
  # content, not hand-editable here; fixing it means updating the generator
  # script to emit the real deployed origin below, then re-running it -- out
  # of scope for this specific gateway-response fix.
  CheckpointApiUnauthorizedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ProofPathApi
      ResponseType: UNAUTHORIZED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'https://main.${CheckpointWebApp.DefaultDomain}'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type,Idempotency-Key'"

  CheckpointApiDefault4xxGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ProofPathApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'https://main.${CheckpointWebApp.DefaultDomain}'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type,Idempotency-Key'"

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api
      Handler: health.lambda_handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref ProofPathApi
            Path: /health
            Method: get
            # No `Auth:` here: security is authored directly per-operation in
            # the generated DefinitionBody above (raw swagger `security`
            # keys), not via SAM's `Auth` abstraction -- SAM's `Authorizer:
            # NONE` requires a `DefaultAuthorizer` on the API resource, which
            # this template intentionally does not set (every operation
            # declares its own auth requirement explicitly instead).

  # -- WP-01: the one disposable checkpoint record -------------------------
  #
  # AppTable is the first canonical DynamoDB table in the project. Its
  # PK/SK shape here covers only the one checkpoint item
  # (USER#<owner_id> / CHECKPOINT#<checkpoint_id>), matching
  # PROOFPATH-SPEC.md section 6's owner-partition convention without
  # pre-deciding WP-07's full single-table key design, per WP-01's spec
  # ("Out of scope" section). Streams are enabled because AC-01-05's durable
  # job chain (Streams -> publisher -> EventBridge -> SQS -> controller ->
  # Step Functions -> task) starts here.
  AppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        SSEEnabled: true

  CheckpointUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: proofpath-checkpoint
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  CheckpointUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CheckpointUserPool
      ClientName: proofpath-web
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # Resolved 2026-09-19 (AC-01-06): real redirect URLs are the deployed
      # Amplify app's default domain (main branch) plus local dev. Update
      # if the Amplify app is ever recreated (DefaultDomain is assigned at
      # creation, not stable across app deletion/recreation).
      CallbackURLs:
        - !Sub https://main.${CheckpointWebApp.DefaultDomain}/
        - http://localhost:5173/
      LogoutURLs:
        - !Sub https://main.${CheckpointWebApp.DefaultDomain}/
        - http://localhost:5173/

  # AC-01-06: Cognito Hosted UI domain, required for the OAuth2 Authorization
  # Code + PKCE flow (AllowedOAuthFlows: [code] above) -- the browser
  # redirects here to sign in, not to a URL this project hosts itself.
  CheckpointUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref CheckpointUserPool
      Domain: !Sub proofpath-checkpoint-${AWS::AccountId}

  # AC-01-06: deployable UI. Manually deployed (via `aws amplify
  # create-deployment`/`start-deployment` with web/dist's build output),
  # not connected to GitHub -- avoids granting Amplify OAuth access to the
  # repo, which needs the user's explicit sign-off and is out of scope for
  # an automated deploy/test session.
  CheckpointWebApp:
    Type: AWS::Amplify::App
    Properties:
      Name: proofpath-checkpoint-web
      Platform: WEB

  CheckpointWebBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt CheckpointWebApp.AppId
      BranchName: main
      EnableAutoBuild: false

  # -- WP-01's disposable checkpoint API/job chain (AC-01-01/03/05) has been
  # removed: it served its purpose proving the DynamoDB write -> Streams ->
  # publisher -> EventBridge -> SQS -> controller -> Step Functions -> task
  # pipeline works end to end (see docs/evidence/checkpoint.md's AC-01-05
  # section for that evidence), and per WP-01's own spec, "This checkpoint
  # can use thin vertical code that later packages replace behind the same
  # contracts. It must not become an alternate architecture." WP-07 builds
  # the real job chain against its own StateStore port and this same
  # AppTable (kept below, unchanged) rather than extending this throwaway
  # one. Removed 2026-09-20 once the overlap was identified.

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

  # ---------------------------------------------------------------------
  # AC-01-04: Fargate-hosted Playwright locality/merchant smoke check.
  # Reuses P2's WP-04 agent image (services/agent/**, services/merchants/**)
  # rather than a second, competing container -- this package only adds the
  # infrastructure to build/push/run that already-reviewed image once, run
  # one real search, and tear the task down. No ECS Service, no ALB, no
  # standing task: `aws ecs run-task` for one-off invocations only, per
  # AC-01-09's "no running Fargate task left standing" requirement.
  # ---------------------------------------------------------------------

  CheckpointAgentEvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub proofpath-checkpoint-evidence-${AWS::AccountId}
      # Screenshots only, no PII/product-scale data -- a short lifecycle
      # keeps this from becoming a silent standing-cost/data-retention item
      # if teardown is ever missed (S3 storage itself is billed regardless
      # of "hourly" framing, unlike compute, but this bounds it).
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCheckpointEvidence
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  CheckpointAgentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: proofpath-checkpoint-agent
      ImageScanningConfiguration:
        ScanOnPush: true
      # Only the one image this checkpoint run needs; an unbounded ECR
      # repository is a real, if small, standing-cost/drift risk of its own.
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep only the 3 most recent images",
              "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 3},
              "action": {"type": "expire"}
            }]
          }

  CheckpointAgentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # AC-01-04 Fargate agent task. Egress-only by default -- no inbound
      # rule is baked into this template. The one-off manual smoke test
      # adds a temporary, scoped ingress rule for the operator's own IP
      # immediately before the run and revokes it immediately after,
      # rather than leaving port 8080 open to the world as a standing
      # template default.
      GroupDescription: AC-01-04 Fargate agent task security group, egress-only by default.
      VpcId: !Ref CheckpointVpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Outbound to real merchant domains and ECR/S3/CloudWatch endpoints.

  CheckpointAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/proofpath-checkpoint-agent
      RetentionInDays: 14

  CheckpointAgentCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: proofpath-checkpoint-agent
      # No Container Insights, no capacity providers beyond Fargate's
      # default -- a one-off smoke-test cluster needs neither.

  CheckpointAgentTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: proofpath-checkpoint-agent-task-execution
      Description: >-
        ECS-assumed role that pulls the container image and ships its logs
        -- never assumed by application code inside the container itself
        (see CheckpointAgentTaskRole for that). Least-privilege: scoped to
        exactly this one repository/log group, not the AWS-managed
        AmazonECSTaskExecutionRolePolicy's account-wide equivalents.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullImageAndWriteLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                # ECR's GetAuthorizationToken, like its Public counterpart
                # used for AC-01-08, does not support resource-level
                # restriction -- "*" here is the narrowest this action can
                # be scoped, not an unreviewed broad grant.
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt CheckpointAgentRepository.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CheckpointAgentLogGroup.Arn}:*"

  CheckpointAgentTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: proofpath-checkpoint-agent-task
      Description: >-
        Assumed by the running container itself (services/agent/main.py),
        via its injected credentials -- scoped to exactly the one S3 write
        permission the agent's evidence sink needs
        (services/merchants/evidence.py's S3EvidenceSink), nothing else.
        The agent never calls any other AWS API.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteEvidenceOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${CheckpointAgentEvidenceBucket.Arn}/*"

  CheckpointAgentTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: proofpath-checkpoint-agent
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "3072"
      ExecutionRoleArn: !GetAtt CheckpointAgentTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt CheckpointAgentTaskRole.Arn
      ContainerDefinitions:
        - Name: agent
          Image: !Sub "${CheckpointAgentRepository.RepositoryUri}:latest"
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: PROOFPATH_EVIDENCE_BUCKET
              Value: !Ref CheckpointAgentEvidenceBucket
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            # PROOFPATH_AGENT_TOKEN is deliberately not set here as a plain
            # template value (never a literal secret in source control);
            # the operator supplies it as a `run-task` container override
            # at invocation time for this one-off manual smoke test.
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CheckpointAgentLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: agent

  # --- WP-07: durable job transport ---------------------------------------
  #
  # These sit against the canonical AppTable above rather than a table of their
  # own. WP-01's disposable proof of the same chain was removed once its
  # evidence was captured (PR #18); this is the real one.
  #
  # The two worker Lambdas -- the outbox publisher reading AppTable's stream and
  # the job consumer reading JobQueue -- are deliberately NOT declared here yet,
  # and neither is the state machine that would invoke a task function. They
  # need a packaging decision this template cannot make: the workers import
  # across the whole `services` tree, so `CodeUri` cannot be
  # `../services/workers`, and SAM builds a Python function from a
  # requirements.txt inside its own CodeUri, which that directory does not have.
  #
  # WP-01 had solved this -- a `uv build --wheel` plus `uv pip install --target`
  # step in scripts/proofpath.ps1 injected `services/**` into each function's
  # build output after `sam build`. PR #18 removed that step along with the
  # checkpoint infra it was serving, so the blocker is open again. Declaring the
  # functions before it is closed would produce a stack that deploys and then
  # fails on the first import, which is worse than one that does not deploy.
  #
  # Everything below is ordinary CloudFormation that `sam build` does not touch,
  # so it is safe to land now: the routing exists and is reviewable, and adding
  # the functions later is an additive change.
  #
  # When they are added, both event source mappings MUST declare
  # `FunctionResponseTypes: [ReportBatchItemFailures]`. Both handlers reason
  # carefully about which messages to report for retry, and Lambda ignores that
  # reply entirely without the opt-in -- a refused EventBridge entry, a vanished
  # outbox row and an unparseable message would all be deleted silently, with
  # nothing in the Python to look at. tests/contracts/test_infra_wiring.py
  # enforces this the moment a batched source appears.

  ProofPathEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${AWS::StackName}-jobs"

  # A dead-lettered message is the last trace of a committed command, so it is
  # kept for the SQS maximum rather than a shorter window someone picked.
  JobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days, the SQS maximum

  # Both handlers report an unusable message so it is redelivered and then dead
  # lettered: a partial-batch reply cannot say "dead-letter this now", and
  # reporting success would delete a committed command. Without a redrive policy
  # that message is redelivered for ever. maxReceiveCount is WP-01's answer to
  # O-2, matching the value its own checkpoint queue used.
  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 120 # >= the 100s worker timeout the spec fixes
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDeadLetterQueue.Arn
        maxReceiveCount: 5

  JobQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref JobQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt JobQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt JobRule.Arn

  # The outbox publisher puts one event per committed row onto the bus; this
  # rule is what turns those into queued work. The pattern matches on the
  # publisher's own source rather than on event detail, so a new job type does
  # not need a rule change.
  JobRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref ProofPathEventBus
      Description: Route published outbox events to the job queue.
      State: ENABLED
      EventPattern:
        source:
          - proofpath.outbox
      Targets:
        - Id: JobQueue
          Arn: !GetAtt JobQueue.Arn


Outputs:
  ApiUrl:
    Description: Base invoke URL for the deployed API stage.
    Value: !Sub https://${ProofPathApi}.execute-api.${AWS::Region}.amazonaws.com/v1/
  AppTableName:
    Value: !Ref AppTable
  CheckpointUserPoolId:
    Value: !Ref CheckpointUserPool
  CheckpointUserPoolClientId:
    Value: !Ref CheckpointUserPoolClient
  CheckpointUserPoolHostedUiDomain:
    Description: Cognito Hosted UI domain prefix (full URL is https://<this>.auth.<region>.amazoncognito.com).
    Value: !Ref CheckpointUserPoolDomain
  WebAppId:
    Description: Amplify App ID, needed for `aws amplify create-deployment`/`start-deployment`.
    Value: !GetAtt CheckpointWebApp.AppId
  WebUrl:
    Description: The deployed web client's URL (Amplify's default domain, main branch).
    Value: !Sub https://main.${CheckpointWebApp.DefaultDomain}/
  CheckpointAgentRepositoryUri:
    Description: Push the built services/agent/Dockerfile image here before running the task.
    Value: !GetAtt CheckpointAgentRepository.RepositoryUri
  CheckpointAgentClusterName:
    Value: !Ref CheckpointAgentCluster
  CheckpointAgentTaskDefinitionArn:
    Value: !Ref CheckpointAgentTaskDefinition
  CheckpointAgentSecurityGroupId:
    Description: Add a temporary ingress rule here for the operator's IP before the manual smoke test.
    Value: !Ref CheckpointAgentSecurityGroup
  CheckpointAgentEvidenceBucketName:
    Value: !Ref CheckpointAgentEvidenceBucket

  JobQueueUrl:
    Description: WP-07 job queue (PROOFPATH_JOB_QUEUE_URL).
    Value: !Ref JobQueue

  JobDeadLetterQueueUrl:
    Description: WP-07 dead-letter queue; inspect this when a job stops arriving.
    Value: !Ref JobDeadLetterQueue

  EventBusName:
    Description: WP-07 event bus (PROOFPATH_EVENT_BUS_NAME).
    Value: !Ref ProofPathEventBus
