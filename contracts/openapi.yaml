openapi: 3.0.3
info:
  title: ProofPath API
  version: 0.0.0
  description: >
    Transport contract. WP-00 established the envelope, the shared primitives and
    the public liveness route; later work packages add their own paths and schemas
    under the same components. Every path stays inside the API Gateway/SAM subset
    the repository's openapi-check enforces.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Return the public liveness result.
      responses:
        "200":
          description: The service is live.
          headers:
            X-Request-ID:
              description: Opaque server-generated request identifier.
              required: true
              schema:
                $ref: "#/components/schemas/OpaqueId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccessResponse"
        "500":
          description: An unexpected error was safely mapped by the application.
          headers:
            X-Request-ID:
              description: Opaque server-generated request identifier.
              required: true
              schema:
                $ref: "#/components/schemas/OpaqueId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # --- WP-08 / WP-09 (P3) -------------------------------------------------
  /purchases:
    post:
      operationId: createPurchase
      summary: Create a purchase from a chosen basket and start the re-check.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      responses:
        "202":
          description: Committed; the re-check is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"
        "409":
          description: Stale revision, or the key was reused with a different payload.

  /purchases/{id}:
    get:
      operationId: getPurchase
      summary: Read a purchase, its current quote, and whether approval is permitted.
      parameters:
        - $ref: "#/components/parameters/PurchaseId"
      responses:
        "200":
          description: The purchase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "404":
          description: >
            Absent, or not yours — deliberately indistinguishable. Telling
            someone a purchase exists but is not theirs still tells them it
            exists.

  /purchases/{id}/preparations/{version}/accept:
    post:
      operationId: acceptPreparation
      summary: Accept an exact change list and receive the quote it yields.
      parameters:
        - $ref: "#/components/parameters/PurchaseId"
        - $ref: "#/components/parameters/PreparationVersion"
      responses:
        "200":
          description: Accepted; quote built.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "409":
          description: The change list moved, or the version is stale.
        "410":
          description: The re-check is older than 120s; re-check again.
        "422":
          description: >
            No quote is possible because a charge is unknown. An unknown charge
            has no ceiling, so no amount on the approval control would be true.

  /purchases/{id}/approve:
    post:
      operationId: approvePurchase
      summary: Approve the exact simulated quote.
      description: >
        The only endpoint that creates a payment attempt. It requires the quote
        hash and two version numbers together, which only the card that
        displayed them possesses — a model, a spoken "yes" or a replayed
        transcript does not.
      parameters:
        - $ref: "#/components/parameters/PurchaseId"
        - $ref: "#/components/parameters/Idempotency-Key"
      responses:
        "200":
          description: >
            The attempt already existed — a replay, or a lost race. Not an
            error: the payment may be in flight, and calling it a failure would
            be a lie.
        "202":
          description: One attempt created; checkout queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"
        "409":
          description: >
            Stale version, tampered hash, reused key, or a prior payment still
            unresolved.
        "410":
          description: The quote expired; re-check and approve again.

  /purchases/{id}/cancel:
    post:
      operationId: cancelPurchase
      summary: Cancel before anything is sent.
      parameters:
        - $ref: "#/components/parameters/PurchaseId"
      responses:
        "200":
          description: Cancelled.
        "409":
          description: An attempt already exists, or approve won the race.

  /purchases/{id}/reconcile:
    post:
      operationId: reconcilePurchase
      summary: Ask the provider what actually happened.
      description: >
        Reads the references we already hold. Creates no payment, no order, no
        refund and no attempt — the handler is wired to a read-only provider
        port that has no write verb on it.
      parameters:
        - $ref: "#/components/parameters/PurchaseId"
      responses:
        "200":
          description: What the provider says now, and whether it changed anything.
        "404":
          description: Absent, or not yours.

  /purchases/{id}/case:
    get:
      operationId: getPurchaseCase
      summary: What is known, and what is still missing.
      parameters:
        - $ref: "#/components/parameters/PurchaseId"
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: No case, or not yours.

  /demo/scenarios:
    post:
      operationId: setDemoScenario
      summary: Set the simulated provider's next behaviour (operator only).
      description: A shopper receives 404, not 403.
      responses:
        "200":
          description: Scenario set.
        "404":
          description: Not an operator.

  /demo/effects:
    get:
      operationId: getDemoEffects
      summary: Effect counts straight off the provider's ledger (operator only).
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectCounts"
        "404":
          description: Not an operator.

  /callbacks/simulator:
    post:
      operationId: ingestSimulatorCallback
      summary: Provider callback ingestion (contract by WP-09, endpoint by P4 in WP-10).
      description: >
        The signature covers delivery_timestamp, a newline, event_id, a newline,
        then the raw body exactly as received — never a re-serialised object,
        because a JSON round-trip reorders keys and would break an honest
        delivery. The immutable inbox row is written before any 2xx.
      responses:
        "200":
          description: Applied, or a duplicate redelivery.
        "202":
          description: Recorded but not applied — conflicted or quarantined.
        "400":
          description: Unknown provider, or timestamp skew over five minutes.
        "401":
          description: Signature invalid.

components:
  parameters:
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      description: Reusable non-empty idempotency key for future mutations.
      schema:
        type: string
        minLength: 1
    PurchaseId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    PreparationVersion:
      name: version
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Version"
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      description: Opaque identifier. Clients must not parse it or infer its meaning.
    UtcTimestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp normalized to UTC by servers.
    CurrencyCode:
      type: string
      enum:
        - INR
    MoneyINR:
      type: object
      additionalProperties: false
      required:
        - amount_paise
        - currency
      properties:
        amount_paise:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          $ref: "#/components/schemas/CurrencyCode"
    Version:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Revision:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    JobStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
    AsyncAccepted:
      type: object
      additionalProperties: false
      required:
        - job_id
        - resource_id
        - status_url
      properties:
        job_id:
          $ref: "#/components/schemas/OpaqueId"
        resource_id:
          $ref: "#/components/schemas/OpaqueId"
        status_url:
          type: string
          format: uri
    HealthData:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    HealthSuccessResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          $ref: "#/components/schemas/HealthData"
        request_id:
          $ref: "#/components/schemas/OpaqueId"
    ErrorBody:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - request_id
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        request_id:
          $ref: "#/components/schemas/OpaqueId"

    # --- WP-08 / WP-09 (P3) -----------------------------------------------
    Confidence:
      type: string
      description: >
        How well an amount is known. `verified` is exact. `estimated` is an
        upper bound — the amount carried is the most it should be. `unknown`
        means no bound exists at all, and is never rendered as zero.
      enum:
        - verified
        - estimated
        - unknown

    Charge:
      type: object
      additionalProperties: false
      required:
        - kind
        - confidence
      properties:
        kind:
          type: string
          enum:
            - delivery
            - handling
            - packaging
            - small_order
            - surge
            - tax
            - other
        confidence:
          $ref: "#/components/schemas/Confidence"
        amount:
          $ref: "#/components/schemas/MoneyINR"
      description: >
        `amount` is absent exactly when confidence is `unknown`. Absent
        means "we could not confirm this fee". It is never zero, and a quote is
        never built while such a charge exists.

    QuoteLine:
      type: object
      additionalProperties: false
      required:
        - sku
        - name
        - quantity_base
        - dimension
        - unit_price
        - line_total
      properties:
        sku:
          type: string
        name:
          type: string
        quantity_base:
          type: integer
          minimum: 1
        dimension:
          type: string
          enum:
            - mass
            - volume
            - count
        unit_price:
          $ref: "#/components/schemas/MoneyINR"
        line_total:
          $ref: "#/components/schemas/MoneyINR"
        substituted:
          type: boolean
          default: false

    Quote:
      type: object
      additionalProperties: false
      required:
        - quote_id
        - quote_version
        - quote_hash
        - seller
        - mode
        - lines
        - charges
        - total
        - amount_is_ceiling
        - delivery
        - expires_at
        - approve_label
        - disclaimer
      properties:
        quote_id:
          $ref: "#/components/schemas/OpaqueId"
        quote_version:
          $ref: "#/components/schemas/Version"
        quote_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >
            Binds every term shown, including live-or-fixture mode and each
            charge's confidence. Send it back unchanged on approve; a mismatch
            is a 409.
        seller:
          type: string
        source_merchant:
          type: string
        mode:
          type: string
          enum:
            - live
            - fixture
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QuoteLine"
        charges:
          type: array
          items:
            $ref: "#/components/schemas/Charge"
        total:
          $ref: "#/components/schemas/MoneyINR"
        amount_is_ceiling:
          type: boolean
          default: false
          description: >
            True when total_paise is a maximum rather than an exact price, which
            is the case whenever any charge is estimated. The live merchants can
            never report a complete fee — a real one exists only inside a cart
            that is deliberately never touched — so live quotes always set this.
            Render the amount as a ceiling everywhere it appears, not only on
            the approve control. See WP-02-A1.
        delivery:
          type: string
        expires_at:
          type: string
          format: date-time
        approve_label:
          type: string
          description: >
            The exact label for the approval control — "Approve simulated
            Rs 590.00" when the total is exact, "Approve simulated up to
            Rs 590.00" when amount_is_ceiling is true. Render it; do not compose
            it. The words "up to" are the difference between stating a bound and
            making a claim.
        disclaimer:
          type: string
          description: Must be visible on every quote and approval surface.
        estimated_fees_note:
          type: string
          description: >
            Present exactly when `amount_is_ceiling` is true, so its presence is
            itself the signal. Says the fees were estimated from each store's
            published charges rather than read from a cart, and that the total
            should not exceed the amount shown. Neither the mode nor the fixture
            label covers this: a live quote is live data and can still carry an
            estimated fee. Render it alongside the amount, not behind a
            disclosure toggle.

    Purchase:
      type: object
      additionalProperties: false
      required:
        - purchase_id
        - version
        - mode
        - payment
        - order
        - refund
        - approve_enabled
      properties:
        purchase_id:
          $ref: "#/components/schemas/OpaqueId"
        version:
          $ref: "#/components/schemas/Version"
        mode:
          type: string
          enum:
            - live
            - fixture
        payment:
          type: string
          description: >
            `unknown` is its own state. It is not failure and not success, and
            must never be rendered as either.
          enum:
            - not_started
            - claimed
            - pending
            - unknown
            - succeeded
            - failed
        order:
          type: string
          enum:
            - not_created
            - pending
            - unknown
            - confirmed
            - failed
        refund:
          type: string
          enum:
            - none
            - pending
            - unknown
            - completed
            - failed
        active_attempt_id:
          $ref: "#/components/schemas/OpaqueId"
        quote:
          $ref: "#/components/schemas/Quote"
        approve_enabled:
          type: boolean
          description: >
            Server-computed. Bind the approve control to this field alone, never
            to a client-side countdown — otherwise the button can re-enable in
            the gap between "looks expired" and the expiry actually committing.
        disclaimer:
          type: string
        fixture_label:
          type: string

    Case:
      type: object
      additionalProperties: false
      required:
        - case_id
        - purchase_id
        - status
        - known_facts
        - missing_facts
      properties:
        case_id:
          $ref: "#/components/schemas/OpaqueId"
        purchase_id:
          $ref: "#/components/schemas/OpaqueId"
        status:
          type: string
          enum:
            - open
            - awaiting_user
            - resolved
            - closed
        known_facts:
          type: array
          items:
            type: string
            enum:
              - payment
              - order
              - refund
        missing_facts:
          type: array
          description: >
            Named gaps, not an absence. "We cannot tell whether an order exists"
            is the sentence a shopper most needs said out loud.
          items:
            type: string
            enum:
              - payment_outcome
              - order_existence
              - order_reference
              - refund_outcome
              - merchant_confirmation

    EffectCounts:
      type: object
      additionalProperties: false
      description: Operator only. Read from the provider's ledger, not from our state.
      properties:
        payment_effects:
          type: integer
          minimum: 0
        order_effects:
          type: integer
          minimum: 0
        submissions_received:
          type: integer
          minimum: 0
        duplicate_submissions_suppressed:
          type: integer
          minimum: 0
        rejections:
          type: integer
          minimum: 0
        attempts_dispatched:
          type: integer
          minimum: 0
          description: >
            Must equal payment_effects. Any other relationship is a bug.

    PurchaseErrorCode:
      type: string
      description: >
        The domain outcomes WP-02/08/09 return, carried in the shared envelope's
        `error.code`. Documented here rather than by widening the baseline's
        ErrorBody pattern, so the shared envelope stays open to every work
        package while clients of these endpoints still get an exhaustive list to
        branch on. A 409 means four genuinely different things across the
        purchase endpoints and each needs its own wording -- collapsing them into
        one "conflict" screen is the mistake this list exists to prevent.
      enum:
        - version_conflict
        - idempotency_payload_mismatch
        - diff_hash_mismatch
        - diff_not_accepted
        - quote_hash_mismatch
        - quote_not_constructible
        - quote_expired
        - preparation_expired
        - approval_expired
        - approval_already_consumed
        - purchase_already_claimed
        - attempt_blocked_by_exposure
        - payment_key_conflict
        - illegal_transition
        - contradictory_provider_fact
        - condition_failed
        - invalid_record
        - unpriced_line
        - unknown_charge
        - estimated_total
        - incompatible_units
        - budget_exceeded
        - overbuy_limit_exceeded
        - hard_attribute_unsatisfied
        - not_found
        - validation_error

    PurchaseErrorBody:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - details
      properties:
        code:
          $ref: "#/components/schemas/PurchaseErrorCode"
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    PurchaseErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - request_id
      properties:
        error:
          $ref: "#/components/schemas/PurchaseErrorBody"
        request_id:
          $ref: "#/components/schemas/OpaqueId"
