name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PROOFPATH_NODE_VERSION: "24.21.0"
  PROOFPATH_UV_VERSION: "0.12.13"
  PROOFPATH_PYTHON_VERSION: "3.12.14"
  # aws-actions/setup-sam v3 resolved to release commit 89ddb14d60e682855e3fea4be85b3c56485de310
  # (https://github.com/aws-actions/setup-sam/releases/tag/v3); no finer concrete semver tag
  # exists in that repository's tag list at the time of pinning.
  PROOFPATH_SAM_VERSION: "1.164.0"

jobs:
  locks-and-generated:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
          sam-version: ${{ env.PROOFPATH_SAM_VERSION }}
          setup-sam: "true"
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Validate OpenAPI, regenerate declarations and SAM export, and check for drift
        run: pwsh ./scripts/proofpath.ps1 openapi-check

  format-lint-type:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Format check
        run: pwsh ./scripts/proofpath.ps1 format-check
      - name: Lint
        run: pwsh ./scripts/proofpath.ps1 lint
      - name: Typecheck
        run: pwsh ./scripts/proofpath.ps1 typecheck

  unit-contract-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Run deterministic test suites
        run: pwsh ./scripts/proofpath.ps1 test

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
          sam-version: ${{ env.PROOFPATH_SAM_VERSION }}
          setup-sam: "true"
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Configure AWS credentials via OIDC (ECR Public auth only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PROOFPATH_CI_ECR_ROLE_ARN }}
          # ECR Public's control-plane API lands only in us-east-1, regardless
          # of the app's ap-south-1 region (see infra/github-oidc.yaml and
          # WP-01 AC-01-08); this is not a region-consistency violation.
          aws-region: us-east-1
      - name: Authenticate Docker to ECR Public
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
      - name: Build web and containerized SAM artifacts
        run: pwsh ./scripts/proofpath.ps1 build

  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for Gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Run security checks
        run: pwsh ./scripts/proofpath.ps1 security

  web-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
          sam-version: ${{ env.PROOFPATH_SAM_VERSION }}
          setup-sam: "true"
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Configure AWS credentials via OIDC (ECR Public auth only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PROOFPATH_CI_ECR_ROLE_ARN }}
          aws-region: us-east-1
      - name: Authenticate Docker to ECR Public
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
      - name: Install pinned Chromium
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Run scaffold and health smoke
        run: pwsh ./scripts/proofpath.ps1 web-smoke

  # TEMPORARY, THROWAWAY: diagnoses the AC-01-08/PR #9 base_ref trust-policy
  # mismatch. Decodes the JWT payload the runner already has and prints only
  # non-sensitive claim fields (sub/base_ref/head_ref/ref/event_name -- the
  # same repo/branch info already visible on this PR, not secrets). Remove
  # this job once infra/github-oidc.yaml's base_ref condition is fixed.
  debug-oidc-claims:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Print non-sensitive OIDC claims (sub/base_ref/head_ref/ref/aud)
        run: |
          decode() {
            PAYLOAD=$(echo "$1" | cut -d. -f2 | tr '_-' '/+')
            case $((${#PAYLOAD} % 4)) in 2) PAYLOAD="$PAYLOAD==";; 3) PAYLOAD="$PAYLOAD=";; esac
            echo "$PAYLOAD" | base64 -d | jq '{aud, sub, base_ref, head_ref, ref, event_name}'
          }
          echo "== token requested with explicit audience=sts.amazonaws.com (what my earlier debug step used) =="
          TOKEN_EXPLICIT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          decode "$TOKEN_EXPLICIT"
          echo "== token requested with NO audience param (matches aws-actions/configure-aws-credentials's actual call, which sets no 'audience:' input) =="
          TOKEN_DEFAULT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          decode "$TOKEN_DEFAULT"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
