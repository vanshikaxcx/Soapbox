name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PROOFPATH_NODE_VERSION: "24.21.0"
  PROOFPATH_UV_VERSION: "0.12.13"
  PROOFPATH_PYTHON_VERSION: "3.12.14"
  # aws-actions/setup-sam v3 resolved to release commit 89ddb14d60e682855e3fea4be85b3c56485de310
  # (https://github.com/aws-actions/setup-sam/releases/tag/v3); no finer concrete semver tag
  # exists in that repository's tag list at the time of pinning.
  PROOFPATH_SAM_VERSION: "1.164.0"

jobs:
  locks-and-generated:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
          sam-version: ${{ env.PROOFPATH_SAM_VERSION }}
          setup-sam: "true"
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Validate OpenAPI, regenerate declarations and SAM export, and check for drift
        run: pwsh ./scripts/proofpath.ps1 openapi-check

  format-lint-type:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Format check
        run: pwsh ./scripts/proofpath.ps1 format-check
      - name: Lint
        run: pwsh ./scripts/proofpath.ps1 lint
      - name: Typecheck
        run: pwsh ./scripts/proofpath.ps1 typecheck

  unit-contract-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Run deterministic test suites
        run: pwsh ./scripts/proofpath.ps1 test

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
          sam-version: ${{ env.PROOFPATH_SAM_VERSION }}
          setup-sam: "true"
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Configure AWS credentials via OIDC (ECR Public auth only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PROOFPATH_CI_ECR_ROLE_ARN }}
          # ECR Public's control-plane API lands only in us-east-1, regardless
          # of the app's ap-south-1 region (see infra/github-oidc.yaml and
          # WP-01 AC-01-08); this is not a region-consistency violation.
          aws-region: us-east-1
          # Explicit, not relying on this action's own default: confirmed via
          # a debug job (2026-09-19) that a token requested with no audience
          # query param at all gets `aud: https://github.com/<org>`, not
          # `sts.amazonaws.com` -- exactly what infra/github-oidc.yaml's
          # trust-policy Condition requires and was silently not matching.
          audience: sts.amazonaws.com
      - name: Authenticate Docker to ECR Public
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
      # Confirmed 2026-09-19: `sam build --use-container`'s own image pull
      # is unreliable in this runner environment -- it intermittently fails
      # with "Could not find ... image locally and failed to pull it from
      # docker" even when the `docker login` step right above has already
      # succeeded with valid credentials. A plain `docker pull` of the same
      # pinned digest does not have this problem; pre-pulling it here lets
      # `sam build` find the image locally (its own documented fallback
      # path) instead of depending on its internal pull succeeding.
      - name: Pre-pull the pinned SAM build image (works around sam build's unreliable internal pull)
        run: docker pull public.ecr.aws/sam/build-python3.12@sha256:6b977f28341c892f743070ef945b600f1b257b668003720dc3bc9b1839fcd666
      - name: Build web and containerized SAM artifacts
        run: pwsh ./scripts/proofpath.ps1 build

  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for Gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Run security checks
        run: pwsh ./scripts/proofpath.ps1 security

  web-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
          sam-version: ${{ env.PROOFPATH_SAM_VERSION }}
          setup-sam: "true"
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Configure AWS credentials via OIDC (ECR Public auth only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PROOFPATH_CI_ECR_ROLE_ARN }}
          aws-region: us-east-1
          # See the build job's identical step for why this is explicit.
          audience: sts.amazonaws.com
      - name: Authenticate Docker to ECR Public
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
      # See the build job's identical step for why this is here.
      - name: Pre-pull the pinned SAM build image (works around sam build's unreliable internal pull)
        run: docker pull public.ecr.aws/sam/build-python3.12@sha256:6b977f28341c892f743070ef945b600f1b257b668003720dc3bc9b1839fcd666
      - name: Install pinned Chromium
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Run scaffold and health smoke
        run: pwsh ./scripts/proofpath.ps1 web-smoke
