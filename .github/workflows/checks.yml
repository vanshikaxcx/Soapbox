name: checks

on:
  pull_request:
  push:
    branches: [main]
  # NOTE: infra/github-oidc.yaml's CI role trust policy only accepts a
  # push-shaped token for `ref:refs/heads/main` and a pull_request-shaped
  # token with `base_ref: main` -- a manual "Run workflow" dispatch on any
  # other branch produces a push-shaped token for that branch's own ref,
  # which matches neither trust-policy statement. build/web-smoke's OIDC
  # step will fail AssumeRoleWithWebIdentity in that case; this is a known,
  # accepted limitation (broadening the trust policy to accept any branch
  # ref would also broaden what a future push-triggered run could assume
  # the role for), not a bug to chase if you hit it via manual dispatch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PROOFPATH_NODE_VERSION: "24.21.0"
  PROOFPATH_UV_VERSION: "0.12.13"
  PROOFPATH_PYTHON_VERSION: "3.12.14"
  # aws-actions/setup-sam v3 resolved to release commit 89ddb14d60e682855e3fea4be85b3c56485de310
  # (https://github.com/aws-actions/setup-sam/releases/tag/v3); no finer concrete semver tag
  # exists in that repository's tag list at the time of pinning.
  PROOFPATH_SAM_VERSION: "1.164.0"
  # Must match README.md's documented digest exactly -- update both
  # together. See .github/actions/ecr-public-auth for where this is used.
  PROOFPATH_SAM_BUILD_IMAGE_DIGEST: "6b977f28341c892f743070ef945b600f1b257b668003720dc3bc9b1839fcd666"

jobs:
  locks-and-generated:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
          sam-version: ${{ env.PROOFPATH_SAM_VERSION }}
          setup-sam: "true"
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Validate OpenAPI, regenerate declarations and SAM export, and check for drift
        run: pwsh ./scripts/proofpath.ps1 openapi-check

  format-lint-type:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Format check
        run: pwsh ./scripts/proofpath.ps1 format-check
      - name: Lint
        run: pwsh ./scripts/proofpath.ps1 lint
      - name: Typecheck
        run: pwsh ./scripts/proofpath.ps1 typecheck

  unit-contract-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Run deterministic test suites
        run: pwsh ./scripts/proofpath.ps1 test

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
          sam-version: ${{ env.PROOFPATH_SAM_VERSION }}
          setup-sam: "true"
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      # Skipped for a pull_request from a fork: a fork's PR run gets a real
      # OIDC token whose sub/base_ref claims satisfy infra/github-oidc.yaml's
      # pull_request trust statement (that statement can only scope by
      # target branch, not fork-vs-same-repo -- GitHub's pull_request token
      # doesn't expose that distinction), so this guard is what actually
      # keeps a fork PR from assuming the CI role, rather than relying on
      # the trust policy alone. A fork PR's build still runs, just without
      # authenticated ECR Public access -- same unauthenticated-pull
      # behavior this whole OIDC path exists to avoid for trusted runs.
      - name: Authenticate to ECR Public and pre-pull the pinned SAM build image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/ecr-public-auth
        with:
          role-arn: ${{ vars.PROOFPATH_CI_ECR_ROLE_ARN }}
          sam-build-image-digest: ${{ env.PROOFPATH_SAM_BUILD_IMAGE_DIGEST }}
      - name: Build web and containerized SAM artifacts
        run: pwsh ./scripts/proofpath.ps1 build

  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for Gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      - name: Run security checks
        run: pwsh ./scripts/proofpath.ps1 security

  web-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.PROOFPATH_NODE_VERSION }}
          uv-version: ${{ env.PROOFPATH_UV_VERSION }}
          python-version: ${{ env.PROOFPATH_PYTHON_VERSION }}
          sam-version: ${{ env.PROOFPATH_SAM_VERSION }}
          setup-sam: "true"
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Sync Python dependencies (frozen)
        run: uv sync --frozen
      # See the build job's identical step for why this is skipped for fork
      # pull_request runs and why the build still proceeds without it.
      - name: Authenticate to ECR Public and pre-pull the pinned SAM build image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/ecr-public-auth
        with:
          role-arn: ${{ vars.PROOFPATH_CI_ECR_ROLE_ARN }}
          sam-build-image-digest: ${{ env.PROOFPATH_SAM_BUILD_IMAGE_DIGEST }}
      - name: Install pinned Chromium
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Run scaffold and health smoke
        run: pwsh ./scripts/proofpath.ps1 web-smoke
